[project]
name = "ispc-intrvw-prop-sizing"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.0.2",
    "scipy>=1.15.3",
    "typing-extensions>=4.16.0",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]
addopts = "--strict-markers"
markers = [
    "unit: tests of a single function or class",
    "integration: tests of the whole sizing",
]

[tool.coverage.run]
source = [
    "src",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[project.scripts]
main = "src.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.ruff.lint]
select = [
    "ALL",
]
ignore = [
    "CPY001",
    "D203",
    "D213",
    "EM101",
    "EM102",
    "TRY003",
]

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",
    "INP001",
    "D100",
    "D103",
    "PLR2004",
]
